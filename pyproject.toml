[project]
name = "SNIFS-pipeline"
version = "0.1.0"
description = "A modern data reduction pipeline for SNIFS"
readme = "README.md"
authors = [
    { name = "Samuel Hinton", email = "samuelreay@gmail.com" },
]
requires-python = ">=3.13"

dependencies = [
    "asdf>=4.2.0",
    "astropy>=7.0.1",
    "cmasher>=1.9.2",
    "gitpython>=3.1.44",
    "loguru>=0.7.3",
    "matplotlib>=3.10.1",
    "numpy>=2.2.4",
    "pandas>=2.3.1",
    "pandera>=0.23.1",
    "polars>=1.26.0",
    "prefect>=3.6.6",
    "prefect-docker>=0.6.6",
    "pycosmic",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.8.1",
    "scikit-image>=0.26.0",
    "scipy>=1.15.3",
]

[project.optional-dependencies]
prefect = []


[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.5.4,<1",
    "pre-commit>=3.7.0",
]

[tool.uv.sources]
pycosmic = { git = "https://github.com/brandherd/PyCosmic" }

# TODO: Swap over to https://github.com/astral-sh/uv/issues/8779 when ready
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
extend-select = ["F", "E", "W", "C", "I", "B", "T", "D", "DOC", "NPY"]
extend-ignore = ["T201", "D10", "DOC201"]

[tool.ruff.lint.extend-per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.prefect]
logging.level = "INFO"
server.ephemeral.enabled = true

[tool.pytest.ini_options]
addopts = "-v"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:prefect.*",
    "ignore::DeprecationWarning:_griffe.*",
]
pythonpath = ["src"]
